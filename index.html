<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
    <title>Book Library</title>
  </head>
  <body>
    <dialog id="add-book">
      <form id="my-form" method="dialog" autocomplete="off">
        <h2>Add a book</h2>

        <div class="field">
          <label for="title-input">Title</label>
          <input
            type="text"
            id="title-input"
            name="title"
            placeholder="e.g. The Hobbit"
            required
          />
        </div>

        <div class="field">
          <label for="author-input">Author</label>
          <input
            type="text"
            id="author-input"
            name="author"
            placeholder="e.g. J.R.R. Tolkien"
            required
          />
        </div>

        <div class="field">
          <label for="pages-input">Pages</label>
          <input
            type="number"
            id="pages-input"
            name="pages"
            placeholder="e.g. 310"
            min="1"
            required
          />
        </div>

        <div class="dialog-actions">
          <button
            id="closebtn"
            class="btn btn-secondary"
            commandfor="add-book"
            command="close"
            type="button"
          >
            Cancel
          </button>
          <button type="submit" class="btn btn-primary">Submit book</button>
        </div>
      </form>
    </dialog>

    <header>
      <h1 class="header-title">Books in the library</h1>
      <button
        id="new-book"
        class="btn btn-primary"
        command="show-modal"
        commandfor="add-book"
      >
        + Add Book
      </button>
    </header>

    <main class="library">
      <section id="book-cards"></section>
    </main>
  </body>
</html>
